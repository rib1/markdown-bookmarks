name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build test images
        run: docker compose build quality all-tests

      - name: Lint JavaScript
        run: docker compose run --rm quality npm run lint

      - name: Run tests
        run: docker compose run --rm all-tests
