services:
  quality:
    build:
      context: .
      target: quality

  bookmarkd:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      VAULT_PATH: /vault
      BOOKMARK_RESULTS_DIR: /vault/views/.search-results
      BOOKMARK_RESULTS_HOST_VAULT: ${BOOKMARK_VAULT:-${PWD}/vault}
      PORT: 8787
    volumes:
      - ${BOOKMARK_VAULT:-./vault}:/vault

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    depends_on:
      - bookmarkd
    environment:
      API_URL: http://bookmarkd:8787
      VAULT_PATH: /vault
    volumes:
      - ./test-data:/vault

  all-tests:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    volumes:
      - ./test-data:/vault
    command: ["sh", "all-tests.sh"]
